<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .panel h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 0.95em;
        }

        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            resize: vertical;
        }

        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            min-height: 250px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .results-section.hidden {
            display: none;
        }

        .results-section h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
        }

        .decision-card {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .decision-card h3 {
            font-size: 1.1em;
            color: #222;
            margin-bottom: 12px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .field-value {
            color: #555;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border-left: 4px solid #e88;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .demo-badge {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        a {
            color: #667eea;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 0.85em;
            color: #999;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Decision Extractor</h1>
            <p>Extract decisions from conversations using Claude AI</p>
        </div>

        <div class="content">
            <div class="panel">
                <h2>API Key</h2>
                <div class="form-group">
                    <label for="apiKey">Anthropic API Key</label>
                    <input
                        type="password"
                        id="apiKey"
                        placeholder="sk-ant-..."
                        autocomplete="off"
                    >
                    <p class="help-text">
                        Leave empty to see sample results. <a href="https://console.anthropic.com/account/keys" target="_blank">Get your API key →</a>
                    </p>
                </div>
            </div>

            <div class="panel">
                <h2>Conversation</h2>
                <div class="form-group">
                    <label for="conversation">Paste conversation text</label>
                    <textarea
                        id="conversation"
                        placeholder="Paste your conversation here. Can be email, chat, meeting notes, Slack thread, etc."
                    ></textarea>
                </div>
            </div>
        </div>

        <div class="button-group" style="max-width: 600px; margin: 0 auto 30px;">
            <button class="btn-primary" id="extractBtn">Extract Decisions</button>
            <button class="btn-secondary" id="clearBtn">Clear</button>
        </div>

        <div class="results-section hidden" id="resultsSection">
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const conversationInput = document.getElementById('conversation');
        const extractBtn = document.getElementById('extractBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContent = document.getElementById('resultsContent');

        const SAMPLE_DECISIONS = [
            {
                decision: "Migrate to microservices architecture",
                owner: "Sarah Chen (CTO)",
                date: "2026-09-15",
                reasoning: "Current monolith causing deployment bottlenecks. Microservices will allow independent scaling of auth and payments services.",
                alternatives: [
                    "Vertical scaling (rejected: cost-prohibitive)",
                    "Optimize existing monolith (rejected: diminishing returns)"
                ],
                openQuestions: [
                    "Which services to extract first?",
                    "How to handle shared database transitions?"
                ]
            },
            {
                decision: "Adopt TypeScript for all new backend services",
                owner: "James Rodriguez (Engineering Lead)",
                date: "2026-09-18",
                reasoning: "Type safety will reduce runtime errors in production. Prevents regressions in new microservices.",
                alternatives: [
                    "Stick with JavaScript (rejected: type safety concerns)",
                    "Use Flow (rejected: less industry adoption)"
                ],
                openQuestions: [
                    "Should we migrate existing services?",
                    "Training plan for team members new to TypeScript?"
                ]
            },
            {
                decision: "Launch beta program with 100 pilot customers",
                owner: "Maria Santos (Product)",
                date: "2026-09-20",
                reasoning: "Need real-world feedback before GA. 100 customers large enough for statistical significance, small enough to handle support burden.",
                alternatives: [
                    "Launch to 1000 customers (rejected: too risky)",
                    "Internal testing only (rejected: not representative of real usage)"
                ],
                openQuestions: [
                    "Which customer segments to prioritize?",
                    "Success metrics for beta graduation?"
                ]
            }
        ];

        clearBtn.addEventListener('click', () => {
            conversationInput.value = '';
            resultsSection.classList.add('hidden');
        });

        extractBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            const conversation = conversationInput.value.trim();

            if (!conversation) {
                alert('Please paste a conversation to extract decisions from.');
                return;
            }

            if (!apiKey) {
                showSampleResults();
            } else {
                extractWithAPI(apiKey, conversation);
            }
        });

        function showSampleResults() {
            resultsContent.innerHTML = `
                <div class="demo-badge">DEMO MODE - No API key provided</div>
                <p style="color: #666; margin-bottom: 20px;">Here's what extracted decisions look like. Add your API key to analyze your own conversations.</p>
                ${SAMPLE_DECISIONS.map(decision => renderDecision(decision)).join('')}
            `;
            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function extractWithAPI(apiKey, conversation) {
            extractBtn.disabled = true;
            resultsContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing conversation...</p></div>';
            resultsSection.classList.remove('hidden');

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-1',
                        max_tokens: 4096,
                        system: `You are an expert at extracting decisions from conversations.

Extract all decisions made or mentioned in the conversation. For each decision, provide:
1. The decision itself (what was decided)
2. Owner (who made or is responsible for the decision)
3. Date (when was it decided, estimate if not given)
4. Reasoning (why was this decision made)
5. Alternatives considered (what other options were discussed)
6. Open questions (what remains unclear or needs follow-up)

Return the results as a JSON array with this structure:
[
  {
    "decision": "...",
    "owner": "...",
    "date": "...",
    "reasoning": "...",
    "alternatives": ["...", "..."],
    "openQuestions": ["...", "..."]
  }
]

If there are no clear decisions, return an empty array [].`,
                        messages: [{
                            role: 'user',
                            content: `Please extract all decisions from this conversation:\n\n${conversation}`
                        }]
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || `API error: ${response.status}`);
                }

                const data = await response.json();
                const content = data.content[0].text;

                let decisions = [];
                try {
                    const jsonMatch = content.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        decisions = JSON.parse(jsonMatch[0]);
                    }
                } catch (e) {
                    console.error('Failed to parse JSON from response:', content);
                }

                if (decisions.length === 0) {
                    resultsContent.innerHTML = '<div class="error">No decisions found in the provided conversation. Try pasting a different conversation or one with more discussion.</div>';
                } else {
                    resultsContent.innerHTML = decisions.map(decision => renderDecision(decision)).join('');
                }

            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            } finally {
                extractBtn.disabled = false;
            }
        }

        function renderDecision(decision) {
            return `
                <div class="decision-card">
                    <h3>${escapeHtml(decision.decision)}</h3>
                    <div class="field">
                        <span class="field-label">👤 Owner</span>
                        <div class="field-value">${escapeHtml(decision.owner)}</div>
                    </div>
                    <div class="field">
                        <span class="field-label">📅 Date</span>
                        <div class="field-value">${escapeHtml(decision.date)}</div>
                    </div>
                    <div class="field">
                        <span class="field-label">💡 Reasoning</span>
                        <div class="field-value">${escapeHtml(decision.reasoning)}</div>
                    </div>
                    <div class="field">
                        <span class="field-label">🔄 Alternatives Considered</span>
                        <div class="field-value">
                            ${Array.isArray(decision.alternatives) && decision.alternatives.length > 0
                                ? '<ul style="margin-left: 20px;">' + decision.alternatives.map(alt => `<li>${escapeHtml(alt)}</li>`).join('') + '</ul>'
                                : '<em>None documented</em>'
                            }
                        </div>
                    </div>
                    <div class="field">
                        <span class="field-label">❓ Open Questions</span>
                        <div class="field-value">
                            ${Array.isArray(decision.openQuestions) && decision.openQuestions.length > 0
                                ? '<ul style="margin-left: 20px;">' + decision.openQuestions.map(q => `<li>${escapeHtml(q)}</li>`).join('') + '</ul>'
                                : '<em>None identified</em>'
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Cmd/Ctrl+Enter to submit
        conversationInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                extractBtn.click();
            }
        });
    </script>
</body>
</html>
